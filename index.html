<Steps>
  <Step title="Create a New GitHub Repository">
    1. Go to [GitHub](https://github.com) and log in to your account.
    2. Click the **+** icon in the top-right corner and select **New repository**.
    3. Enter a repository name (e.g., `portal` or `gateway`).
    4. Ensure the visibility is set to **Public** (GitHub Pages requires public repositories for free accounts).
    5. Click **Create repository**.

    *Verification:* You will see your new repository page with options to push or upload files.
  </Step>

  <Step title="Upload Your index.html File">
    1. Click **uploading an existing file** on the repository main page (or **Add file** > **Upload files**).
    2. Drag and drop your local HTML file, or click **choose your files** to select it.
    3. Make sure the file is named **`index.html`** in all lowercase so GitHub automatically treats it as the homepage.
    4. Click the green **Commit changes** button at the bottom.

    *Verification:* You will see `index.html` listed in the main file list of your repository.
  </Step>

  <Step title="Enable GitHub Pages">
    1. Click the **Settings** tab located in the top navigation bar of your repository.
    2. On the left sidebar, click **Pages** under the "Code and automation" section.
    3. Under **Build and deployment**, set the **Branch** dropdown from `None` to **`main`** (or `master`).
    4. Leave the folder dropdown set to `/ (root)` and click **Save**.

    *Verification:* Refresh the page after 1 to 2 minutes. A banner will appear at the top of the Pages section stating: *"Your site is live at https://<username>.github.io/<repository-name>/"*.
  </Step>

  <Step title="Test Your Site">
    1. Click the provided GitHub Pages link to open your live site in a new tab.
    2. Type your passcode to unlock the portal.
    3. Click the **Launch** button to trigger your `about:blank` window.

    *Verification:* The page will launch into an `about:blank` tab and display your target site inside a full-viewport iframe without any connection errors.
  </Step>
</Steps>
